name: Build and deploy Shadowing English to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Angular dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Copy Angular build to ASP.NET wwwroot
        shell: pwsh
        run: |
          $frontend = ".\dist\shadowing-demo\browser"
          $wwwroot = ".\backend\ShadowingEnglish.Api\wwwroot"

          if (-not (Test-Path "$frontend\index.html")) {
            throw "Angular build index.html was not found."
          }

          New-Item -ItemType Directory -Force -Path $wwwroot | Out-Null
          Remove-Item "$wwwroot\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "$frontend\*" "$wwwroot" -Recurse -Force

          if (-not (Test-Path "$wwwroot\index.html")) {
            throw "Frontend copy to wwwroot failed."
          }

          $legacyProxy = Get-ChildItem $wwwroot -Recurse -File -Include *.js,*.html |
            Select-String -Pattern "/__ai/" -SimpleMatch

          if ($legacyProxy) {
            throw "Legacy /__ai/ frontend proxy detected."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish ASP.NET Core
        run: dotnet publish .\backend\ShadowingEnglish.Api\ShadowingEnglish.Api.csproj -c Release -o .\publish\azure

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EEDDB8D771A843AC8352451711794276 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E238A1B206974DEFBA9F2BADFB2A7D83 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_10F79E9CF7E44507BD368C3124007D48 }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'shadowing-english-staging'
          slot-name: 'Production'
          package: '.\publish\azure'
