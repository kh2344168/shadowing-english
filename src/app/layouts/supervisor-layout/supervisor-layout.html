<main dir="rtl" class="min-h-screen bg-[#F7FAF8] text-[#17241D]">
  <aside class="fixed inset-y-0 right-0 z-40 hidden w-[270px] border-l border-[#D7E8DE] bg-[#145A3A] px-4 py-5 text-white lg:flex lg:flex-col">
    <div class="mb-8 flex items-center gap-3 px-2"><div class="grid h-12 w-12 place-items-center rounded-2xl bg-[#35A66F] text-xl font-black">S</div><div><strong class="block font-black">لوحة المشرف</strong><span class="text-xs font-bold text-green-100">متابعة الطلاب</span></div></div>
    <nav class="grid gap-2 text-sm font-black">
      <a routerLink="/supervisor/dashboard" routerLinkActive="bg-white/15" class="flex h-12 items-center gap-3 rounded-xl px-4 text-green-50 no-underline hover:bg-white/10"><fa-icon [icon]="icons.home"></fa-icon>الرئيسية</a>
      <a routerLink="/supervisor/students" routerLinkActive="bg-white/15" class="flex h-12 items-center gap-3 rounded-xl px-4 text-green-50 no-underline hover:bg-white/10"><fa-icon [icon]="icons.students"></fa-icon>الطلاب</a>
      <a routerLink="/supervisor/groups" routerLinkActive="bg-white/15" class="flex h-12 items-center gap-3 rounded-xl px-4 text-green-50 no-underline hover:bg-white/10"><fa-icon [icon]="icons.groups"></fa-icon>المجموعات والتقدم</a>
      <a routerLink="/supervisor/subscriptions" routerLinkActive="bg-white/15" class="flex h-12 items-center gap-3 rounded-xl px-4 text-green-50 no-underline hover:bg-white/10"><fa-icon [icon]="icons.subscriptions"></fa-icon>الاشتراكات</a>
      <a routerLink="/supervisor/weekly-summaries" routerLinkActive="bg-white/15" class="flex h-12 items-center gap-3 rounded-xl px-4 text-green-50 no-underline hover:bg-white/10"><fa-icon [icon]="icons.summaries"></fa-icon>التلخيص الأسبوعي</a>
      <a routerLink="/supervisor/messages" routerLinkActive="bg-white/15" class="flex h-12 items-center gap-3 rounded-xl px-4 text-green-50 no-underline hover:bg-white/10"><fa-icon [icon]="icons.messages"></fa-icon>الرسائل</a>
      <a routerLink="/supervisor/reports" routerLinkActive="bg-white/15" class="flex h-12 items-center gap-3 rounded-xl px-4 text-green-50 no-underline hover:bg-white/10"><fa-icon [icon]="icons.reports"></fa-icon>التقارير</a>
    </nav>
    <div *ngIf="auth.currentUser as user" class="mt-auto rounded-2xl bg-white/10 p-4"><strong class="block truncate text-sm">{{ user.name }}</strong><small class="mt-1 block truncate text-green-100">{{ user.email }}</small><button type="button" (click)="logout()" class="mt-3 flex h-10 w-full items-center justify-center gap-2 rounded-xl bg-white text-sm font-black text-[#145A3A]"><fa-icon [icon]="icons.logout"></fa-icon>خروج</button></div>
  </aside>
  <div class="border-b border-[#D7E8DE] bg-white px-4 py-3 lg:hidden"><div class="flex items-center justify-between"><strong class="text-[#145A3A]">لوحة المشرف</strong><button type="button" (click)="logout()" class="rounded-xl bg-[#EAF6EF] px-3 py-2 text-xs font-black text-[#145A3A]">خروج</button></div><nav class="mt-3 flex gap-2 overflow-x-auto pb-1 text-xs font-black"><a routerLink="/supervisor/dashboard" class="shrink-0 rounded-xl bg-[#EAF6EF] px-3 py-2 text-[#145A3A] no-underline">الرئيسية</a><a routerLink="/supervisor/students" class="shrink-0 rounded-xl bg-[#EAF6EF] px-3 py-2 text-[#145A3A] no-underline">الطلاب</a><a routerLink="/supervisor/groups" class="shrink-0 rounded-xl bg-[#EAF6EF] px-3 py-2 text-[#145A3A] no-underline">المجموعات</a><a routerLink="/supervisor/weekly-summaries" class="shrink-0 rounded-xl bg-[#EAF6EF] px-3 py-2 text-[#145A3A] no-underline">التلخيصات</a></nav></div>
  <section class="min-h-screen p-4 sm:p-6 lg:mr-[270px] lg:p-8"><router-outlet></router-outlet></section>
</main>
