<section dir="rtl" class="mx-auto max-w-[1350px]"><header class="mb-6"><span class="text-xs font-black uppercase tracking-[.18em] text-[#238A58]">Messages</span><h1 class="mt-2 text-3xl font-black text-[#145A3A]">رسائل وملاحظات الطلاب</h1><p class="mt-2 text-sm font-bold text-[#64748B]">رسائل داخل النظام لمتابعة الطالب وتشجيعه أو تنبيهه.</p></header><div class="grid gap-5 xl:grid-cols-[380px_1fr]"><form (ngSubmit)="send()" class="h-fit rounded-[26px] border border-[#D7E8DE] bg-white p-5"><h2 class="text-lg font-black text-[#145A3A]">رسالة جديدة</h2><label class="mt-4 block text-sm font-black">الطالب<select [(ngModel)]="studentId" name="studentId" class="mt-2 h-11 w-full rounded-xl border border-[#CBD5E1] px-3"><option *ngFor="let student of students" [value]="student.id">{{ student.name }}</option></select></label><label class="mt-4 block text-sm font-black">العنوان<input [(ngModel)]="subject" name="subject" class="mt-2 h-11 w-full rounded-xl border border-[#CBD5E1] px-3" /></label><label class="mt-4 block text-sm font-black">الرسالة<textarea [(ngModel)]="body" name="body" rows="6" class="mt-2 w-full rounded-xl border border-[#CBD5E1] p-3"></textarea></label><button class="mt-4 h-11 w-full rounded-xl bg-[#238A58] text-sm font-black text-white">إرسال</button><p *ngIf="feedback" class="mt-3 rounded-xl bg-[#EAF6EF] p-3 text-xs font-black text-[#145A3A]">{{ feedback }}</p></form><section class="rounded-[26px] border border-[#D7E8DE] bg-white p-5"><h2 class="mb-4 text-lg font-black text-[#145A3A]">سجل الرسائل</h2><div class="grid gap-3"><article *ngFor="let item of messages" class="rounded-2xl border border-[#E2E8F0] p-4"><div class="flex items-center justify-between gap-3"><div><strong>{{ item.subject }}</strong><span class="mt-1 block text-xs font-bold text-[#64748B]">إلى {{ studentName(item.studentId) }} · {{ item.createdAt | date:'medium' }}</span></div><span class="rounded-full bg-blue-50 px-3 py-1 text-[10px] font-black text-blue-800">{{ item.read ? 'مقروءة' : 'جديدة' }}</span></div><p class="mt-3 text-sm font-bold leading-7 text-[#475569]">{{ item.body }}</p></article></div></section></div></section>
