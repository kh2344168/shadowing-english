<section dir="rtl" class="mx-auto max-w-[900px]"><header class="mb-6"><span class="text-xs font-black uppercase tracking-[.18em] text-[#7C3AED]">Messages</span><h1 class="mt-2 text-3xl font-black text-[#3B1A75]">رسائل المشرف</h1><p class="mt-2 text-sm font-bold text-[#64748B]">ملاحظات وتشجيع وتنبيهات خاصة بتقدمك.</p></header><div class="grid gap-3"><article *ngFor="let item of messages" (click)="open(item.id)" class="cursor-pointer rounded-[24px] border bg-white p-5 shadow-sm" [ngClass]="item.read ? 'border-[#E2E8F0]' : 'border-purple-300 bg-purple-50'"><div class="flex items-start justify-between gap-3"><div><strong class="text-lg font-black">{{ item.subject }}</strong><span class="mt-1 block text-xs font-bold text-[#64748B]">من {{ item.senderName }} · {{ item.createdAt | date:'medium' }}</span></div><span *ngIf="!item.read" class="rounded-full bg-purple-600 px-3 py-1 text-[10px] font-black text-white">جديدة</span></div><p class="mt-4 text-sm font-bold leading-7 text-[#475569]">{{ item.body }}</p></article><div *ngIf="messages.length===0" class="rounded-[24px] border border-dashed border-purple-200 bg-white p-12 text-center text-sm font-bold text-[#64748B]">لا توجد رسائل حاليًا.</div></div></section>
